name: Release and Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-client:
    name: Build Client (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary_name: ipchat
            archive_ext: tar.gz
            make_deb: true
            deb_arch: amd64
          - os: macos-latest
            target: macos-x64
            binary_name: ipchat
            archive_ext: tar.gz
            make_deb: false
          - os: macos-14
            target: macos-arm64
            binary_name: ipchat
            archive_ext: tar.gz
            make_deb: false
          - os: windows-latest
            target: windows-x64
            binary_name: ipchat.exe
            archive_ext: zip
            make_deb: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Run Unit Tests
        run: dart test

      - name: Compile Native Executable
        run: |
          dart compile exe bin/ipchat.dart \
            --dart-define=DEFAULT_RELAY="${{ secrets.DEFAULT_RELAY_SERVER || 'ipchatrelay.octetit.com' }}" \
            --dart-define=DEFAULT_PORT=443 \
            -o ${{ matrix.binary_name }}

      - name: Create Tarball Archive (Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          tar -czvf "ipchat-${{ matrix.target }}.tar.gz" ${{ matrix.binary_name }}

      - name: Create Zip Archive (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.binary_name }} -DestinationPath "ipchat-${{ matrix.target }}.zip"

      - name: Build Debian (.deb) Package
        if: matrix.make_deb == true
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="0.1.0"; fi
          ./packaging/build-deb.sh ${{ matrix.binary_name }} "$VERSION" ${{ matrix.deb_arch }} ./dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            ipchat-${{ matrix.target }}.*
            dist/*.deb

  build-docker-relay:
    name: Build & Push Relay Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-client, build-docker-relay]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
